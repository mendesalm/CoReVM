name: Deploy Automático CoReVM

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar comandos na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== LOCALIZANDO DIRETORIO COREVM / CORE ==="
            APP_DIR=""
            if [ -d "/var/www/corevm" ]; then APP_DIR="/var/www/corevm"; fi
            if [ -z "$APP_DIR" ] && [ -d "/var/www/core" ]; then APP_DIR="/var/www/core"; fi
            echo "APP_DIR=$APP_DIR"
            
            if [ -n "$APP_DIR" ]; then
              cd "$APP_DIR"
              git pull origin main
              
              # Backend
              if [ -f "venv/bin/activate" ]; then
                source venv/bin/activate
              elif [ -f "../venv/bin/activate" ]; then
                source ../venv/bin/activate
              fi
              pip install -r backend/requirements.txt
              python backend/init_db.py || true
              
              # Identifica servico systemd e reinicia
              sudo systemctl daemon-reload || true
              sudo systemctl restart corevm || true
              sudo systemctl restart core || true
              sudo systemctl restart core-backend || true
              sudo systemctl restart corevm-backend || true
              
              # Frontend
              if [ -d "frontend" ]; then
                cd frontend
                npm install
                npm run build
                cd ..
              fi
            fi
            
            echo "=== STATUS DOS SERVICOS SYSTEMD ==="
            systemctl status corevm --no-pager || true
            systemctl status core --no-pager || true
            
            echo "=== TESTE CURL PORTA 8003 LOCAL NA VPS ==="
            curl -sv http://127.0.0.1:8003/api/v1/ || true
            
            echo "=== PORTAS EM ESCUTA NA VPS ==="
            ss -tulpn | grep -E "8000|8001|8002|8003|8004" || true
