name: Deploy Automático CoReVM

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar comandos na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/corevm
            git pull origin main
            
            # Atualiza Backend
            source venv/bin/activate
            pip install -r backend/requirements.txt
            sudo systemctl restart corevm
            
            # Atualiza e compila Frontend
            cd frontend
            npm install
            npm run build
            
            # Se /var/www/core existir separadamente, atualiza e compila tambem
            if [ -d "/var/www/core/frontend" ]; then
              cd /var/www/core
              git pull origin main || true
              cd frontend && npm install && npm run build || true
            fi
